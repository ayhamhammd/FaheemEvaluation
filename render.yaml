services:
  - type: web
    name: faheem-evaluation
    runtime: static
    # The site is a single self-contained HTML file at the repo root.
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Serve the page for any path so deep links don't 404.
      - type: rewrite
        source: /*
        destination: /index.html
